  ESPN BET used by millions to products I have shipped solo end-to-end. Earlier,
  at Fidelis Cybersecurity, I worked full-stack across Angular, AngularJS, Node,
  and Java to improve product performance and user experience. I own features
  start to finish with a focus on performance, accessibility, and UX, and I work
  AI-natively, having led Claude Code adoption on my team. I care about building
  interfaces that are fast, reliable, and genuinely good to use.

