# CANONICAL RESUME SOURCE — edit this file, then run `pnpm sync:resume`.
# Generates:
#   - content/resume.yaml          (site subset the Keystatic resume singleton reads)
#   - resume-variants/Resume-A|B|C.md  (full application resumes, summary swapped per variant)
# Do NOT hand-edit content/resume.yaml or the Resume-*.md files; they are generated.

# Single inclusive summary shown on the portfolio site.
siteSummary: >-
  Senior Full-Stack Engineer with 8+ years building high-traffic React and
  TypeScript interfaces at theScore and ESPN BET, including real-money betting,
  plus products shipped solo end-to-end. Earlier at Fidelis CyberSecurity I
  worked full-stack across Angular, Node, and Java; today I lead Claude Code
  adoption on my team.

resumePdf: /kendall-adkins-resume.pdf

# First professional dev role — the site derives "N+ YRS" from this (YYYY-MM),
# so it ticks up automatically on the next build after each anniversary.
careerStart: "2017-11"

# Availability status shown on the resume ticket.
siteStatus: OPEN TO WORK

# Short bio shown on the site resume "ticket" (distinct from the full summary).
siteBio: >-
  Senior full-stack engineer, 8+ years. Builds fast, accessible interfaces for
  real-money products, and ships side projects solo end to end.

# Curated skill groups for the site resume ticket. accent = neon color
# (cyan | amber | pink | lavender | green).
siteSkillGroups:
  - label: Frontend
    accent: cyan
    items: [react, vue, typescript, next.js, css/anim, a11y]
  - label: Backend
    accent: pink
    items: [node, java, graphql, sql]
  - label: Practice
    accent: lavender
    items: [testing, ai-native, mentoring]

# Application-resume summaries, swapped per variant by the generator.
summaries:
  A: >-
    Senior Full-Stack Engineer who pairs 8+ years of React and TypeScript
    expertise with team-level AI-assisted engineering leadership, having led
    Claude Code adoption at theScore. I ship high-traffic, high-reliability
    interfaces and own features end-to-end with an AI-native workflow.
  B: >-
    Product-focused Senior Full-Stack Engineer with 8+ years building
    high-traffic consumer web applications in React and TypeScript, used by
    millions at theScore and ESPN BET. I own features end-to-end with a strong
    emphasis on UX, A/B experimentation, and performance.
  C: >-
    Senior Full-Stack Engineer with 8+ years building high-traffic React and
    TypeScript applications, including real-money, regulated betting interfaces
    at theScore Bet and ESPN BET where accuracy and uptime were non-negotiable.
    I specialize in rendering complex, real-time data clearly and reliably at
    scale.

# Variant-page labels (used in the markdown header + filename meta).
variantMeta:
  A:
    label: AI-focused
    useWhen: JD names AI-assisted development, copilots, agent workflows, or LLM tooling (required or preferred)
  B:
    label: Product / Consumer
    useWhen: Consumer product company, growth/experimentation, or UX-forward role
  C:
    label: Real-time / High-reliability / Fintech
    useWhen: Fintech, trading, real-money, real-time data, data-viz, or regulated/compliance

